version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - langsql_net

  drf:
    build: 
      context: ./DRF-Server/LangSQL
    restart: unless-stopped
    environment:
      - SECRET_KEY=${DRF_SECRET_KEY:-default_insecure_key}
      - DEBUG=false
      - ALLOWED_HOSTS=*
      - DB_HOST=mongodb://mongo:27017
      - CORS_ALLOW_ALL=True
    depends_on:
      - mongo
    networks:
      - langsql_net

  server:
    build: 
      context: ./Server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/LangSQL
      - MONGODB_URL=mongodb://mongo:27017/LangSQL
      - JWT_SECRET=${JWT_SECRET:-17dc172353f5e21e1d7a595254b003056fa5b7c444d7842d8e46cb81d5f70812}
      - SALT=${SALT:-a3f1c8d9e27b4f56a8e2d5c6f3a9e4b7f1d2c3e4a5b6c7d8e9f0a1b2c3d4e5f6}
      - CORS_ORIGINS=https://langsql.yashparmar.in
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=none
      - DRF_SERVER_HOST=http://drf:8000/
      - DRF_SERVICE_TOKEN=${DRF_SERVICE_TOKEN:-5b=61p5&7ga_d#yo1q3-e0$$8^pb@-)lo7qa2a8_h7a8qe7ma^}
      - DRF_SERVER_SERVICE_TOKEN=${DRF_SERVICE_TOKEN:-5b=61p5&7ga_d#yo1q3-e0$$8^pb@-)lo7qa2a8_h7a8qe7ma^}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
    depends_on:
      - mongo
      - drf
    networks:
      - langsql_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - server
    networks:
      - langsql_net

volumes:
  mongo_data:

networks:
  langsql_net:
